[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-fashion-tryon"
version = "0.1.0"
description = "Local fashion virtual try-on assistant starter"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.33.0",
  "diffusers>=0.30.0",
  "fastapi>=0.112.0",
  "numpy>=1.26.0",
  "opencv-python>=4.10.0",
  "pillow>=10.4.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "starlette>=0.37.0",
  "torch>=2.3.0",
  "transformers>=4.43.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
fashion-tryon = "fashion_tryon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
